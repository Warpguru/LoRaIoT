; PlatformIO Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Tell PlatformIO to look for source files in the current directory
; to keep it compatible with the Arduino IDE structure.
src_dir = .

; ---------------------------------------------------------------------------
; Shared settings inherited by all environments
; ---------------------------------------------------------------------------
[env]
framework = arduino
lib_dir = src       ; Matches Arduino IDE's sketch-local library path (src/<LibName>/)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; No ESP_LOG* hooks needed. All logging goes through Log.info/warn/error/debug/trace
; in LogBuffer.cpp, which calls Serial.println() directly and appends to the ring buffer.

lib_deps =
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    bblanchon/ArduinoJson @ ^7.4.3
    ESP32Async/ESPAsyncWebServer @ ^3.12.1
    ESP32Async/AsyncTCP @ ^3.5.0

; ---------------------------------------------------------------------------
; Dual-core targets - enable core-pinning via LORAIOT_DUAL_CORE
; ---------------------------------------------------------------------------

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = -D LORAIOT_DUAL_CORE

[env:esp32s3]
platform = espressif32
board = esp32s3box
build_flags = -D LORAIOT_DUAL_CORE

; ---------------------------------------------------------------------------
; Single-core targets - LORAIOT_DUAL_CORE must NOT be set
; CONFIG_FREERTOS_UNICORE is defined automatically by ESP-IDF for these chips.
; ---------------------------------------------------------------------------

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1

[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1

[env:esp32s2]
platform = espressif32
board = esp32s2box

[env:esp32h2]
platform = espressif32
board = esp32h2
